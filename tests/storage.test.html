<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pruebas de storage.js</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    #resumen { font-size: 1.25rem; font-weight: bold; }
    ul { list-style: none; padding: 0; }
    li { padding: .4rem .6rem; margin: .25rem 0; border-radius: 6px; }
    li.ok { background: #e6f4ea; color: #1e6b34; }
    li.fallo { background: #fdeaea; color: #a11a1a; }
  </style>
</head>
<body>
  <h1>Pruebas de storage.js</h1>
  <p id="resumen"></p>
  <ul id="resultados"></ul>

  <script src="../js/storage.js"></script>
  <script>
    const lista = document.getElementById('resultados');
    let total = 0;
    let aprobadas = 0;

    // ----- Mini herramientas de prueba -----
    function prueba(nombre, fn) {
      total++;
      const li = document.createElement('li');
      try {
        fn();
        aprobadas++;
        li.className = 'ok';
        li.textContent = '✅ ' + nombre;
      } catch (e) {
        li.className = 'fallo';
        li.textContent = '❌ ' + nombre + ' → ' + e.message;
      }
      lista.appendChild(li);
    }

    function igual(actual, esperado) {
      if (actual !== esperado) {
        throw new Error('se esperaba ' + JSON.stringify(esperado) + ' pero se obtuvo ' + JSON.stringify(actual));
      }
    }

    function debeLanzar(fn, fragmento) {
      let error = null;
      try {
        fn();
      } catch (e) {
        error = e;
      }
      if (!error) throw new Error('se esperaba un error y no ocurrió');
      if (fragmento && error.message.indexOf(fragmento) === -1) {
        throw new Error('el mensaje no contiene "' + fragmento + '": ' + error.message);
      }
    }

    // Almacén falso en memoria: NO toca el localStorage real.
    function crearAlmacenFalso() {
      const datos = {};
      return {
        getItem: function (k) {
          return Object.prototype.hasOwnProperty.call(datos, k) ? datos[k] : null;
        },
        setItem: function (k, v) { datos[k] = String(v); },
        removeItem: function (k) { delete datos[k]; }
      };
    }

    // Devuelve el almacén falso y un ProductStorage que lo usa.
    function nuevo() {
      const falso = crearAlmacenFalso();
      return { falso: falso, store: ProductStorage.crear(falso, 'test.productos') };
    }

    // ----- Pruebas -----
    prueba('listar: un almacén vacío devuelve una lista vacía', function () {
      const t = nuevo();
      igual(t.store.listar().length, 0);
    });

    prueba('guardar: asigna id, fecha y limpia espacios del nombre', function () {
      const t = nuevo();
      const g = t.store.guardar({ nombre: '  Torta  ' });
      igual(g.nombre, 'Torta');
      igual(typeof g.id, 'string');
      igual(g.id !== '', true);
      igual(Number.isNaN(Date.parse(g.actualizado)), false);
    });

    prueba('guardar: no modifica el objeto original', function () {
      const t = nuevo();
      const original = { nombre: 'Torta' };
      t.store.guardar(original);
      igual(original.id, undefined);
      igual(original.actualizado, undefined);
    });

    prueba('listar: devuelve el producto guardado con sus insumos', function () {
      const t = nuevo();
      t.store.guardar({
        nombre: 'Torta',
        margen: 40,
        insumos: [{ nombre: 'Harina', precioCompra: 4.2, cantidadComprada: 1000, cantidadUsada: 250, unidad: 'g' }]
      });
      const productos = t.store.listar();
      igual(productos.length, 1);
      igual(productos[0].insumos[0].nombre, 'Harina');
      igual(productos[0].insumos[0].precioCompra, 4.2);
    });

    prueba('obtener: encuentra por id y devuelve null si no existe', function () {
      const t = nuevo();
      const g = t.store.guardar({ nombre: 'Torta' });
      igual(t.store.obtener(g.id).nombre, 'Torta');
      igual(t.store.obtener('no-existe'), null);
    });

    prueba('guardar: con un id existente actualiza sin duplicar', function () {
      const t = nuevo();
      const g = t.store.guardar({ nombre: 'Torta', margen: 40 });
      t.store.guardar({ ...g, nombre: 'Torta grande', margen: 50 });
      const productos = t.store.listar();
      igual(productos.length, 1);
      igual(productos[0].id, g.id);
      igual(productos[0].nombre, 'Torta grande');
      igual(productos[0].margen, 50);
    });

    prueba('guardar: productos distintos reciben ids distintos', function () {
      const t = nuevo();
      const a = t.store.guardar({ nombre: 'A' });
      const b = t.store.guardar({ nombre: 'B' });
      igual(a.id === b.id, false);
      igual(t.store.listar().length, 2);
    });

    prueba('eliminar: quita el producto y devuelve true; si no existe, false', function () {
      const t = nuevo();
      const g = t.store.guardar({ nombre: 'Torta' });
      igual(t.store.eliminar(g.id), true);
      igual(t.store.listar().length, 0);
      igual(t.store.eliminar('no-existe'), false);
    });

    prueba('guardar: rechaza un nombre vacío o ausente', function () {
      const t = nuevo();
      debeLanzar(function () { t.store.guardar({ nombre: '' }); }, 'nombre');
      debeLanzar(function () { t.store.guardar({ nombre: '   ' }); }, 'nombre');
      debeLanzar(function () { t.store.guardar({}); }, 'nombre');
    });

    prueba('listar: el modificado más recientemente aparece primero', function () {
      const t = nuevo();
      t.falso.setItem('test.productos', JSON.stringify([
        { id: 'viejo', nombre: 'Viejo', actualizado: '2026-01-01T10:00:00.000Z' },
        { id: 'nuevo', nombre: 'Nuevo', actualizado: '2026-06-01T10:00:00.000Z' }
      ]));
      igual(t.store.listar()[0].id, 'nuevo');
    });

    prueba('datos dañados (JSON inválido): devuelve [] y conserva un respaldo', function () {
      const t = nuevo();
      t.falso.setItem('test.productos', 'esto no es json {');
      igual(t.store.listar().length, 0);
      igual(t.falso.getItem('test.productos.respaldo'), 'esto no es json {');
    });

    prueba('después de datos dañados se puede volver a guardar', function () {
      const t = nuevo();
      t.falso.setItem('test.productos', 'esto no es json {');
      t.store.guardar({ nombre: 'Nuevo' });
      igual(t.store.listar().length, 1);
    });

    prueba('JSON válido pero que no es una lista: devuelve []', function () {
      const t = nuevo();
      t.falso.setItem('test.productos', '{"a":1}');
      igual(t.store.listar().length, 0);
    });

    prueba('listar: ignora elementos inválidos dentro de la lista', function () {
      const t = nuevo();
      t.falso.setItem('test.productos',
        '[null, 5, "texto", {"id":"a","nombre":"Válido"}, {"nombre":"sin id"}]');
      const productos = t.store.listar();
      igual(productos.length, 1);
      igual(productos[0].id, 'a');
    });

    prueba('guardar: error claro si el almacenamiento falla (lleno)', function () {
      const lleno = crearAlmacenFalso();
      lleno.setItem = function () { throw new Error('QuotaExceededError'); };
      const store = ProductStorage.crear(lleno, 'k');
      debeLanzar(function () { store.guardar({ nombre: 'Torta' }); }, 'No se pudieron guardar');
    });

    prueba('sin almacenamiento disponible: listar devuelve [] y guardar lanza error', function () {
      const store = ProductStorage.crear(null, 'k');
      igual(store.listar().length, 0);
      igual(store.obtener('x'), null);
      debeLanzar(function () { store.guardar({ nombre: 'Torta' }); }, 'No se pudieron guardar');
    });

    prueba('limpiar: borra todos los productos', function () {
      const t = nuevo();
      t.store.guardar({ nombre: 'A' });
      t.store.guardar({ nombre: 'B' });
      t.store.limpiar();
      igual(t.store.listar().length, 0);
      igual(t.falso.getItem('test.productos'), null);
    });

    prueba('usa la clave indicada y no la real de la app', function () {
      const falso = crearAlmacenFalso();
      const store = ProductStorage.crear(falso, 'mi.clave');
      store.guardar({ nombre: 'A' });
      igual(Array.isArray(JSON.parse(falso.getItem('mi.clave'))), true);
      igual(falso.getItem('preciojusto.productos'), null);
    });

    // ----- Resumen -----
    const resumen = document.getElementById('resumen');
    const todoBien = aprobadas === total;
    resumen.textContent = (todoBien ? '✅ ' : '❌ ') + aprobadas + ' de ' + total + ' pruebas pasaron';
    resumen.style.color = todoBien ? '#1e6b34' : '#a11a1a';
  </script>
</body>
</html>
